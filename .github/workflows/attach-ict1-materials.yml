name: Attach ICT1 course materials

# One-off data job: uploads the ICT1 weekly slide decks (docs/ICT1/*.pptx) to the
# course-materials bucket and sets each ICT1 quiz's attachments to exactly its
# mapped deck list (this strips the stale TVE100 PDFs). Run manually
# (workflow_dispatch) — idempotent, safe to re-run. Uses SUPABASE_ACCESS_TOKEN
# (management API) to derive the project's service-role key at run time, since the
# service key is not stored as a repo secret.

on:
  workflow_dispatch:

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Resolve service key and attach materials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zhgfepcmtkjwumyhcirt
        run: |
          SERVICE_KEY=$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            | jq -r '.[] | select(.name=="service_role") | .api_key')
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Failed to derive service-role key from SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          export SUPABASE_URL="https://${PROJECT_REF}.supabase.co"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY"
          bun run db:attach-ict1-materials
