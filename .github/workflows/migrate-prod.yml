name: Migrate production database

# Vercel auto-deploys app code on push to main, but schema does not deploy
# with it — CI's ephemeral Postgres and the production Supabase project are
# separate. This job applies pending migrations to production whenever the
# migration set changes (and on demand).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate-prod.yml"
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref zhgfepcmtkjwumyhcirt
