name: Migrate production database

# Applies pending SQL migrations to the production Supabase project via the
# Supabase Management API (HTTPS, IPv4) instead of `supabase db push`.
#
# Why: the current Supabase CLI resolves the direct DB host over IPv6-only and
# GitHub runners cannot reach it ("IPv6 is not supported on your current
# network. Run supabase link ... to setup IPv4 connection."). The Management
# API is plain HTTPS and needs only the existing SUPABASE_ACCESS_TOKEN secret
# (no DB password). The `supabase_migrations.schema_migrations` ledger is kept
# so applied migrations are never re-run.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate-prod.yml"
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zhgfepcmtkjwumyhcirt
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
          run_sql() {
            curl -sS --fail-with-body -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" '{query: $q}')"
          }

          # Ensure the ledger exists (Supabase's own table; harmless if present).
          run_sql "create schema if not exists supabase_migrations; create table if not exists supabase_migrations.schema_migrations (version text primary key, name text, statements text[]);" >/dev/null

          applied="$(run_sql "select version from supabase_migrations.schema_migrations order by version" | jq -r '.[].version')"
          echo "Ledger versions: $(echo "$applied" | tr '\n' ' ')"

          for f in $(ls supabase/migrations/*.sql | sort); do
            base="$(basename "$f")"
            ver="${base%%_*}"
            if echo "$applied" | grep -qx "$ver"; then
              continue
            fi
            echo "::group::Applying ${base}"
            run_sql "$(cat "$f")"
            run_sql "insert into supabase_migrations.schema_migrations (version, name) values ('${ver}', '${base}') on conflict (version) do nothing;" >/dev/null
            echo "applied ${base} (${ver})"
            echo "::endgroup::"
          done

          echo "All pending migrations applied."
