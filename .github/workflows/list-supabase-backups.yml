name: List Supabase database backups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-backups:
    runs-on: ubuntu-latest
    steps:
      - name: List backup metadata
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: zhgfepcmtkjwumyhcirt
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/backups")"
          jq '{region, walg_enabled, pitr_enabled, backups: [.backups[]? | {id, is_physical_backup, status, inserted_at}], physical_backup_data}' <<<"$response"
