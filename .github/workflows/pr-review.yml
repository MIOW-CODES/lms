name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} | head -c 12000 > /tmp/pr_diff.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review PR with AI
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          diff = open("/tmp/pr_diff.txt").read()
          title = os.environ.get("PR_TITLE", "unknown")
          author = os.environ.get("PR_AUTHOR", "unknown")
          url = os.environ.get("PR_URL", "#")

          prompt = f"""You are a senior code reviewer. Review this pull request and provide:
          1. **Summary** - What the PR does (1-2 sentences)
          2. **Issues** - Bugs, security problems, or code smells (if any)
          3. **Suggestions** - Improvements or best practices
          4. **Rating** - LGTM, Minor issues, or Needs changes

          Be concise and actionable.

          PR: {title}
          Author: {author}
          URL: {url}

          Diff:
          {diff}"""

          payload = json.dumps({
              "model": "mimo-v2.5",
              "messages": [{"role": "user", "content": prompt}],
              "stream": False
          })

          result = subprocess.run([
              "curl", "-s", "-X", "POST",
              "https://opencode.ai/zen/go/v1/chat/completions",
              "-H", "Content-Type: application/json",
              "-H", f"Authorization: Bearer {os.environ.get('OPENCODE_API_KEY', '')}",
              "-d", payload
          ], capture_output=True, text=True)

          try:
              data = json.loads(result.stdout)
              review = data["choices"][0]["message"]["content"]
          except Exception as e:
              review = f"Error generating review: {e}\n\nRaw: {result.stdout[:500]}"

          open("/tmp/review.txt", "w").write(review)
          print("Review generated successfully")
          PYEOF
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Post review to Discord
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          review = open("/tmp/review.txt").read()
          title = os.environ.get("PR_TITLE", "unknown")
          author = os.environ.get("PR_AUTHOR", "unknown")
          url = os.environ.get("PR_URL", "#")
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")

          embed = {
              "title": f"PR Review: {title}",
              "url": url,
              "description": review[:4000],
              "color": 5814783,
              "author": {"name": author},
              "footer": {"text": "Hermes Agent - Auto Review"}
          }

          payload = json.dumps({"embeds": [embed]})

          result = subprocess.run([
              "curl", "-s", "-X", "POST", webhook,
              "-H", "Content-Type: application/json",
              "-d", payload
          ], capture_output=True, text=True)

          print(f"Webhook response: {result.stdout[:200]}")
          PYEOF
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
