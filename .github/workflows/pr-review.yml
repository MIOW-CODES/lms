name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            | head -c 200000 > /tmp/pr_diff.txt
          gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --json files --jq '.files[].path' > /tmp/pr_files.txt
          echo "Diff bytes: $(wc -c < /tmp/pr_diff.txt)"
          echo "Changed files: $(wc -l < /tmp/pr_files.txt)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review PR with AI
        run: python3 scripts/review-pr.py
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Post review to GitHub and Discord
        run: python3 scripts/post-review.py
        env:
          # GitHub PR comment (Hermes Agent Review)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Optional Discord mirror — skipped cleanly when unset
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
